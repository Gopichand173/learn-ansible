# varibale level
# cli level
#task level
# role level
#play level
#hosts_vars level
#inventory level
#group_vars level

- name: Variable demo
  hosts: localhost
  connection: local
  vars: #play level
    a: 100
    b: 200
  tasks: #task level
    - name: Print variable
      ansible.builtin.debug:
        msg: a - {{a}}

    - name: Print variable
      vars:
        a: 200
      ansible.builtin.debug:
        msg: a - {{a}}